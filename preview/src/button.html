---
title: "Button"
layout: "layout/base.html"
---

<h3 class="section-title">Variants</h3>
<div class="preview-group">
    <button class="btn btn--primary">Primary</button>
    <button class="btn btn--secondary">Secondary</button>
    <button class="btn btn--danger">Danger</button>
</div>
<h3 class="section-title">Outline</h3>
<div class="preview-group">
    <button class="btn btn--outline-primary">Primary outline</button>
    <button class="btn btn--outline-secondary">Secondary outline</button>
    <button class="btn btn--outline-danger">Danger outline</button>
</div>
<h3 class="section-title">Soft</h3>
<div class="preview-group">
    <button class="btn btn--soft-primary">Primary soft</button>
    <button class="btn btn--soft-secondary">Secondary soft</button>
    <button class="btn btn--soft-danger">Danger soft</button>
</div>
<h3 class="section-title">Ghost</h3>
<div class="preview-group">
    <button class="btn btn--ghost-primary">Primary ghost</button>
    <button class="btn btn--ghost-secondary">Secondary ghost</button>
    <button class="btn btn--ghost-danger">Danger ghost</button>
</div>
<h3 class="section-title">Link</h3>
<div class="preview-group">
    <button class="btn btn--link">Looks like a link</button>
</div>
<h3 class="section-title">Pill</h3>
<div class="preview-group">
    <button class="btn btn--primary btn--pill btn--sm">Small pill</button>
    <button class="btn btn--primary btn--pill">Pill</button>
    <button class="btn btn--outline-primary btn--pill btn--lg">Large pill</button>
</div>
<h3 class="section-title">Loading</h3>
<div class="preview-group">
    <button class="btn btn--primary btn--loading" aria-busy="true">Saving</button>
    <button class="btn btn--outline-primary btn--loading" aria-busy="true">Saving</button>
    <button class="btn btn--secondary" data-toggle-loading>Click to load</button>
</div>
<h3 class="section-title">Group</h3>
<div class="preview-group">
    <div class="btn-group" role="group" aria-label="Text alignment">
        <button class="btn btn--outline-primary" aria-pressed="true">Left</button>
        <button class="btn btn--outline-primary">Center</button>
        <button class="btn btn--outline-primary">Right</button>
    </div>
    <div class="btn-group" role="group" aria-label="Actions">
        <button class="btn btn--primary">Save</button>
        <button class="btn btn--primary">Save as…</button>
    </div>
    <div class="btn-group btn-group--vertical" role="group" aria-label="Vertical group">
        <button class="btn btn--outline-secondary">Top</button>
        <button class="btn btn--outline-secondary">Middle</button>
        <button class="btn btn--outline-secondary">Bottom</button>
    </div>
</div>
<h3 class="section-title">Sizes</h3>
<div class="preview-group">
    <button class="btn btn--primary btn--lg">Large button</button>
    <button class="btn btn--primary">Generic button</button>
    <button class="btn btn--primary btn--sm">Small button</button>
</div>
<h3 class="section-title">Disabled</h3>
<div class="preview-group">
    <button class="btn btn--primary" disabled="disabled">Save</button>
    <button class="btn btn--secondary" disabled="disabled">Save</button>
    <a class="btn btn--primary btn--disabled" aria-disabled="true">Disabled link</a>
</div>
<h3 class="section-title">Block</h3>
<div class="l-stack" style="--stack-gap: 0.5rem;">
    <button class="btn btn--primary btn--block">Block button</button>
    <button class="btn btn--outline-primary btn--block">Block button</button>
</div>
<h3 class="section-title">Shadow button</h3>
<div class="preview-group">
    <button class="btn btn--primary btn--primary-shadow">Button with shadow</button>
    <button class="btn btn--secondary btn--secondary-shadow">Button with shadow</button>
</div>
<h3 class="section-title">Custom button</h3>
<div class="preview-group">
    <button class="btn btn--custom">Custom button</button>
    <button class="btn btn--tertiary">Tertiary button</button>
</div>
<h3 class="section-title">Custom outline button</h3>
<div class="preview-group">
    <button class="btn btn--dark">This is the button text</button>
    <button class="btn btn--outline-dark">This is the button text</button>
</div>
<h3 class="section-title">Clear Button</h3>
<div class="preview-group">
    <button class="clear-btn">Remove button styles</button>
</div>
<h3 class="section-title">With Icons</h3>
<div class="preview-group">
    <button class="btn btn--secondary btn--sm">
    <svg class="btn__icon" height="24px" viewBox="0 0 24 24" width="24px">
        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" style="fill: currentColor;"></path>
    </svg>Copy button
    </button>
    <button class="btn btn--secondary">
    <svg class="btn__icon btn__icon--sm" height="24px" viewBox="0 0 24 24" width="24px">
        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" style="fill: currentColor;"></path>
    </svg>Copy button
    </button>
    <button class="btn btn--secondary btn--lg">Copy button
    <svg class="btn__icon" height="24px" viewBox="0 0 24 24" width="24px">
        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" style="fill: currentColor;"></path>
    </svg>
    </button>
