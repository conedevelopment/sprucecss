        <script>
          if (localStorage.getItem('spruce-reading-direction')) {
            document.documentElement.setAttribute('dir', localStorage.getItem('spruce-reading-direction'));
          }
          if (localStorage.getItem('spruce-theme-mode')) {
            document.documentElement.setAttribute('data-theme-mode', localStorage.getItem('spruce-theme-mode'));
          }
          if (localStorage.getItem('spruce-style')) {
            document.documentElement.setAttribute('data-spruce-style', localStorage.getItem('spruce-style'));
          }
        </script>

                            <div class="form-group">
                                <label class="form-label" for="style-switcher">Style</label>
                                <select class="form-control form-control--sm" id="style-switcher">
                                    <option value="">Default</option>

                            <div class="form-group">

                    <main class="l-main__body">
                        
<h2 class="section-title">Progress</h2>
<div class="l-stack" style="--stack-gap: 1rem;">
    <progress max="100" value="15">15%</progress>
    <progress max="100" value="60">60%</progress>
    <progress max="100" value="100">100%</progress>
</div>

<h2 class="section-title">Indeterminate</h2>
<progress aria-label="Loading"></progress>

<h2 class="section-title">Meter</h2>
<div class="l-stack" style="--stack-gap: 1rem;">
    <meter min="0" max="100" low="30" high="70" optimum="80" value="90">90</meter>
    <meter min="0" max="100" low="30" high="70" optimum="80" value="50">50</meter>
    <meter min="0" max="100" low="30" high="70" optimum="80" value="20">20</meter>
</div>
